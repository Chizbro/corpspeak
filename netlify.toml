[build]
  # Migrations first so production schema matches the code being deployed.
  command = "bash scripts/push-migrations.sh && npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

# Hourly cap on stored messages (see supabase/migrations/*message_retention*.sql).
[functions."prune-messages-scheduled"]
  schedule = "@hourly"
