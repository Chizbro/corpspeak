# Build runs `supabase link` + `supabase db push` on production (see scripts/netlify-build.sh).
[build]
  command = "bash scripts/netlify-build.sh"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

# Hourly cap on stored messages (see supabase/migrations/*message_retention*.sql).
[functions."prune-messages-scheduled"]
  schedule = "@hourly"
